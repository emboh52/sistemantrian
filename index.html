<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QAntri - Hub Antrean Digital</title>
  
  <!-- Firebase SDK v8 Compat (Diselaraskan dengan file register, display, & dashboard) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f2833, #0b0c10);
      color: #fff;
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .hub-container {
      width: 100%; max-width: 480px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px; border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { color: #66fcf1; margin-bottom: 5px; font-size: 24px; letter-spacing: 2px; }
    p { color: #c5c6c7; font-size: 14px; margin-bottom: 20px; }
    
    /* Indicator Tenant/Toko Aktif */
    .tenant-badge {
      background: rgba(102, 252, 241, 0.1);
      border: 1px solid #66fcf1;
      color: #66fcf1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 25px;
    }
    .btn-change-tenant {
      color: #fdcb6e;
      cursor: pointer;
      text-decoration: underline;
      font-size: 12px;
      margin-left: 8px;
    }
    
    .menu-btn {
      display: block; width: 100%;
      padding: 16px; margin: 15px 0;
      font-size: 16px; font-weight: bold;
      text-decoration: none; border-radius: 12px;
      transition: 0.3s; box-sizing: border-box;
      text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer; border: none;
    }
    .btn-register { background-color: #00b894; color: white; }
    .btn-register:hover { background-color: #55efc4; color: #2d3436; }
    
    .btn-display { background-color: #0984e3; color: white; }
    .btn-display:hover { background-color: #74b9ff; color: #2d3436; }
    
    .btn-dashboard { background-color: #fdcb6e; color: #2d3436; }
    .btn-dashboard:hover { background-color: #ffeaa7; }
    
    .footer { margin-top: 30px; font-size: 12px; color: #8c8c8c; }
  </style>
</head>
<body>

  <div class="hub-container">
    <h1>QAntri</h1>
    <p>Antrean Digital untuk UMKM</p>

    <!-- Label Indikator Toko & Tombol Ganti Toko -->
    <div class="tenant-badge">
      🏪 Toko: <span id="displayTenant">---</span>
      <span class="btn-change-tenant" onclick="gantiTenant()">(Ganti)</span>
    </div>
    
    <!-- Tombol Navigasi Utama -->
    <button class="menu-btn btn-register" onclick="openPage('register')">📝 Halaman Ambil Antrean (Pelanggan)</button>
    <button class="menu-btn btn-display" onclick="openPage('display')">📺 Halaman Display TV (Ruang Tunggu)</button>
    <button class="menu-btn btn-dashboard" onclick="openPage('dashboard')">👨‍💻 Dashboard Petugas / Kasir</button>
   
    <div class="footer">UMKM Digital Solution &bull; Vibe Coding Project</div>
  </div>

  <script>
    // 1. Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB_RYgZg2u7TeLyVfgI9SuhiQs1BKz6tM8",
      authDomain: "qantri-app.firebaseapp.com",
      databaseURL: "https://qantri-app-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qantri-app",
      storageBucket: "qantri-app.firebasestorage.app",
      messagingSenderId: "687819838654",
      appId: "1:687819838654:web:6a56ebb0d43ecf1fa4baef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // 2. Fungsi Penangkap Tenant ID
    function getTenantId() {
      const urlParams = new URLSearchParams(window.location.search);
      let tenant = urlParams.get('tenant');
      
      if (tenant) {
        localStorage.setItem('qantri_tenant', tenant.toLowerCase().trim());
        return tenant.toLowerCase().trim();
      }
      
      tenant = localStorage.getItem('qantri_tenant');
      
      if (!tenant) {
        tenant = prompt("Masukkan ID Toko / Usaha Anda (Contoh: toko-budi):", "demo");
        if (!tenant) tenant = "demo";
        localStorage.setItem('qantri_tenant', tenant.toLowerCase().trim());
      }
      
      return tenant;
    }

    let tenantId = getTenantId();
    document.getElementById('displayTenant').innerText = tenantId;

    // 3. Fungsi untuk Mengganti Tenant ID Langsung dari UI
    function gantiTenant() {
      const tenantBaru = prompt("Masukkan ID Toko / Usaha Baru:", tenantId);
      if (tenantBaru && tenantBaru.trim() !== "") {
        const cleanTenant = tenantBaru.toLowerCase().trim();
        localStorage.setItem('qantri_tenant', cleanTenant);
        window.location.href = `index.html?tenant=${cleanTenant}`;
      }
    }

    // 4. Fungsi Navigasi Membuka Halaman Baru dengan Parameter Tenant
    function openPage(pageName) {
      window.open(`${pageName}.html?tenant=${tenantId}`, '_blank');
    }
  </script>
</body>
</html>
