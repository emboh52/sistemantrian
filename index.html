<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QAntri - Hub Antrean Digital</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f2833, #0b0c10);
      color: #fff;
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .hub-container {
      width: 100%; max-width: 480px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px; border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { color: #66fcf1; margin-bottom: 5px; font-size: 24px; letter-spacing: 2px; }
    p { color: #c5c6c7; font-size: 14px; margin-bottom: 30px; }
    
    .menu-btn {
      display: block; width: 100%;
      padding: 16px; margin: 15px 0;
      font-size: 16px; font-weight: bold;
      text-decoration: none; border-radius: 12px;
      transition: 0.3s; box-sizing: border-box;
      text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer; border: none;
    }
    .btn-register { background-color: #00b894; color: white; }
    .btn-register:hover { background-color: #55efc4; color: #2d3436; }
    
    .btn-display { background-color: #0984e3; color: white; }
    .btn-display:hover { background-color: #74b9ff; color: #2d3436; }
    
    .btn-dashboard { background-color: #fdcb6e; color: #2d3436; }
    .btn-dashboard:hover { background-color: #ffeaa7; }
    
    .footer { margin-top: 30px; font-size: 12px; color: #8c8c8c; }
  </style>
</head>
<body>

  <div class="hub-container">
    <h1>QAntri</h1>
    <p>Antrean Digital untuk UMKM</p>
    
    <!-- Tombol diarahkan langsung ke file HTML di Vercel -->
    <button class="menu-btn btn-register" onclick="openPage('register')">📝 Halaman Ambil Antrean (Pelanggan)</button>
    <button class="menu-btn btn-display" onclick="openPage('display')">📺 Halaman Display TV (Ruang Tunggu)</button>
    <button class="menu-btn btn-dashboard" onclick="openPage('dashboard')">👨‍💻 Dashboard Petugas / Kasir</button>
   
    <div class="footer">UMKM Digital Solution &bull; Vibe Coding Project</div>
  </div>

  <!-- Inisialisasi Firebase menggunakan Firebase v10 SDK Modular via CDN -->

 <script>
    // Fungsi navigasi untuk membuka halaman di tab baru
    function openPage(pageName) {
      window.open(pageName + ".html", '_blank');
    }
  </script>
</body>
</html>
