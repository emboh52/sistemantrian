<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Konfigurasi Firebase kamu
    const firebaseConfig = {
      apiKey: "AIzaSyB_RYgZg2u7TeLyVfgI9SuhiQs1BKz6tM8",
      authDomain: "qantri-app.firebaseapp.com",
      databaseURL: "https://qantri-app-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qantri-app",
      storageBucket: "qantri-app.firebasestorage.app",
      messagingSenderId: "687819838654",
      appId: "1:687819838654:web:6a56ebb0d43ecf1fa4baef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Pantau pengaturan loket untuk mencetak tombol secara dinamis
    database.ref('pengaturan').on('value', (snapshot) => {
      const p = snapshot.val();
      let loketArr = ['UMUM'];
      if (p && p.loket) {
        loketArr = p.loket.split(',').map(s => s.trim().toUpperCase());
      }

      const container = document.getElementById('dynamicButtons');
      container.innerHTML = '';

      loketArr.forEach((loket, index) => {
        const prefix = String.fromCharCode(65 + index); // 0=A, 1=B, dst
        container.innerHTML += `
          <button class="btn-submit" onclick="ambilAntrean('${loket}', '${prefix}')">
            AMBIL ANTREAN ${loket} (${prefix})
          </button>
        `;
      });
    });

    function ambilAntrean(divisi, prefix) {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const address = document.getElementById('customerAddress').value.trim();

      if (!name || !phone || !address) {
        alert("Semua kolom (Nama, No HP, Alamat) wajib diisi!");
        return;
      }

      // 1. Dapatkan format tanggal hari ini (contoh: 2026-08-22)
      // Tujuannya agar nomor antrean otomatis reset mulai dari 1 setiap beda hari
      const d = new Date();
      const today = d.getFullYear() + "-" + 
                    String(d.getMonth() + 1).padStart(2, '0') + "-" + 
                    String(d.getDate()).padStart(2, '0');

      // 2. Tentukan lokasi counter di Firebase (contoh: counters/2026-08-22/A)
const counterRef = database.ref(`tenants/${tenantId}/counters/${today}/${prefix}`);
      // Ubah tombol jadi loading
      const buttons = document.querySelectorAll('.btn-submit');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('dynamicButtons').style.opacity = '0.5';

      // 3. Gunakan Firebase Transaction agar nomor tidak bentrok/ganda
      counterRef.transaction((currentValue) => {
        // Jika belum ada antrean hari ini, mulai dari 1. Jika sudah, tambah 1.
        return (currentValue || 0) + 1;
      }, (error, committed, snapshot) => {
        if (error) {
          alert("Sistem sibuk, gagal mengambil nomor. Silakan coba lagi.");
          resetLoading(buttons);
          return;
        }

        if (committed) {
          // 4. Ambil nomor hasil transaction dan format jadi 3 digit (contoh: 1 -> 001)
          const nextNumber = snapshot.val();
          const formattedNumber = String(nextNumber).padStart(3, '0');
          const nomorAntrean = prefix + '-' + formattedNumber; // Hasil: A-001

          // 5. Susun data pelanggan untuk disimpan ke tabel utama antrean
          let dataAntrean = {
            nomor: nomorAntrean,
            divisi: divisi,
            nama: name,
            phone: phone,
            address: address,
            status: "menunggu",
            tanggal: today, // Tambahkan informasi tanggal
            timestamp: Date.now()
          };

          // 6. Push data ke folder 'antrean/menunggu'
          database.ref(`tenants/${tenantId}/antrean/menunggu`).push(dataAntrean).then(() => {
            document.getElementById('formBox').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('displayTicketNum').innerText = nomorAntrean;
            document.getElementById('displayLoketTujuan').innerText = "Tujuan: " + divisi;
            
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
            resetLoading(buttons);
          }).catch((e) => {
            alert("Gagal menyimpan data antrean.");
            resetLoading(buttons);
          });
        }
      });
    }

    // Fungsi untuk mengambil ID Toko/Tenant yang aktif
function getTenantId() {
  const urlParams = new URLSearchParams(window.location.search);
  let tenant = urlParams.get('tenant');
  
  if (tenant) {
    // Simpan ke memory browser agar tidak hilang
    localStorage.setItem('qantri_tenant', tenant.toLowerCase().trim());
    return tenant.toLowerCase().trim();
  }
  
  // Ambil dari penyimpanan lokal jika URL tidak membawa parameter
  tenant = localStorage.getItem('qantri_tenant');
  
  if (!tenant) {
    // Jika baru pertama dibuka & tidak ada parameter, minta input ID Toko
    tenant = prompt("Masukkan ID Toko / Usaha Anda (Contoh: toko-budi):", "demo");
    if (!tenant) tenant = "demo";
    localStorage.setItem('qantri_tenant', tenant.toLowerCase().trim());
  }
  
  return tenant;
}

// Inisialisasi variabel tenantId di awal script
const tenantId = getTenantId();
console.log("Sistem berjalan untuk Tenant:", tenantId);

    // Fungsi kecil untuk memulihkan tombol setelah proses selesai/gagal
    function resetLoading(buttons) {
      buttons.forEach(btn => btn.disabled = false);
      document.getElementById('dynamicButtons').style.opacity = '1';
    }

    function resetForm() {
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('formBox').style.display = 'block';
    }
  </script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0984e3, #6c5ce7); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
    .card { background: white; width: 100%; max-width: 420px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    h2 { color: #2d3436; margin-top: 0; margin-bottom: 5px; }
    p { color: #636e72; font-size: 14px; margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 13px; font-weight: bold; color: #636e72; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #dfe6e9; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.2s; }
    input:focus { border-color: #0984e3; }
    .btn-submit { width: 100%; padding: 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 10px; color: white; background-color: #0984e3; }
    .btn-submit:hover { background-color: #74b9ff; color: #2d3436; }
    .btn-submit:disabled { background-color: #b2bec3; cursor: not-allowed; }
    #resultBox { display: none; }
    .ticket-number { font-size: 64px; font-weight: bold; color: #0984e3; margin: 10px 0; }
    .btn-reset { background-color: #636e72; margin-top: 15px; width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div id="formBox">
      <h2>AMBIL ANTREAN</h2>
      <p>Silakan lengkapi data diri Anda di bawah ini.</p>
      <div class="input-group"><label>Nama Lengkap</label><input type="text" id="customerName" placeholder="Contoh: Budi Santoso" autocomplete="off"></div>
      <div class="input-group"><label>Nomor WhatsApp / HP</label><input type="tel" id="customerPhone" placeholder="Contoh: 08123456789" autocomplete="off"></div>
      <div class="input-group"><label>Alamat</label><input type="text" id="customerAddress" placeholder="Contoh: Jl. Merdeka No. 10" autocomplete="off"></div>
      
      <div id="dynamicButtons">
        <p style="color: #0984e3; font-weight: bold;">Memuat pilihan loket...</p>
      </div>
    </div>

    <div id="resultBox">
      <p style="text-transform: uppercase; font-weight: bold; color: #00b894; margin:0;">Nomor Antrean Anda</p>
      <div class="ticket-number" id="displayTicketNum">---</div>
      <p id="displayLoketTujuan" style="font-weight: bold; color: #333; font-size: 18px;"></p>
      <p>Silakan perhatikan layar TV pemanggil di ruang tunggu.</p>
      <button class="btn-reset" onclick="resetForm()">Selesai (Ambil Baru)</button>
    </div>
  </div>
</body>
</html>
